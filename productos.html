<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Patitas Shop | Productos</title>
        <link rel="stylesheet" href="css/estilos.css">
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>
<header class="navbar">
    <a href="index.html">
        <img src="img/patitashop2.png" alt="Logo Patitas Shop" class="logo-img">
    </a>
    <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="blogs.html">Blog</a>
        <a href="contacto.html">Contacto</a>
        <a href="login.html">👤 Ingresar</a>
        <a class="cart-link" href="carrito.html">🛒 (<span class="cart-count">0</span>)
        </a>
    </nav>
</header>
<main>
    <section class="page-header">
        <h1>Productos</h1>
        <p>Alimentos y accesorios para nuestros compañeros.</p>
    </section>
    <section class="section">
        <div class="filter-bar">
            <input id="busqueda-productos" type="search" placeholder="Buscar por nombre o categoría" aria-label="Buscar productos">
            <select id="filtro-categoria" aria-label="Filtrar por categoría">
                <option value="Todas">Todas las categorías</option>
                <option value="Perros">Perros</option>
                <option value="Gatos">Gatos</option>
                <option value="Accesorios">Accesorios</option>
            </select>
            <button class="btn btn-light" type="button" onclick="limpiarBusqueda()">Limpiar</button>
        </div>
        <div id="productos-container" class="products-grid">
        </div>
    </section>
</main>
<footer class="footer">
    <div>
        <h3>Patitas Shop</h3>
        <p>Productos para perros y gatos.</p>
    </div>
    <div class="footer-center">
        <a href="blogs.html">Visita nuestro blog</a>
    </div>
    <div class="footer-right">
        <a class="btn btn-light" href="contacto.html">Contacto</a>
    </div>
</footer>
<script src="js/app.js"></script>
</body>
</html>
