<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Patitas Shop | Carrito</title>
        <link rel="stylesheet" href="css/estilos.css">
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <header class="navbar">
            <a href="index.html">
                <img src="img/patitashop2.png" alt="Logo Patitas Shop" class="logo-img">
            </a>
            <nav class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="productos.html">Productos</a>
                <a href="blogs.html">Blog</a>
                <a href="contacto.html">Contacto</a>
                <a class="cart-link" href="carrito.html">🛒 (<span class="cart-count">0</span>)</a>
            </nav>
        </header>
        <main>
            <section class="page-header">
                <h1>Carrito de compra</h1>
                <p>Revisa tus productos antes de finalizar.</p>
            </section>
            <section class="section">
                <div id="carrito-container"></div>
                <div class="cart-summary">
                    <strong>Total: <span id="carrito-total">$0</span></strong>
                    <div class="admin-actions">
                        <button class="btn btn-light" type="button" onclick="vaciarCarrito()">Vaciar carrito</button>
                        <button class="btn btn-orange" type="button" onclick="finalizarCompra()">Finalizar compra</button>
                    </div>
                </div>
            </section>
        </main>
        <footer class="footer">
            <div>
                <h3>Patitas Shop</h3>
            </div>
            <div class="footer-center">
                Compra simulada para proyecto académico.
            </div>
            <div class="footer-right">
                <a class="btn btn-light" href="productos.html">Seguir comprando</a>
            </div>
        </footer>
        <script src="js/app.js"></script>
    </body>
</html>
