<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Patitas Shop | Admin usuarios</title>
        <link rel="stylesheet" href="../css/estilos.css">
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="admin-layout">
            <aside class="admin-menu">
                <h2>🐾 Patitas</h2>
                <a href="index.html">Inicio</a>
                <a href="producto.html">Productos</a>
                <a href="usuario.html">Usuarios</a>
                <a href="../index.html">Volver a tienda</a>
            </aside>
            <section class="admin-content">
                <h1>Mantenedor de usuarios</h1>
                <div class="notice">Roles asociados al sistema: Administrador, Cliente y Vendedor.</div>
                <form id="form-usuario-admin" class="form-card" style="margin:25px 0 30px">
                    <div class="form-group">
                        <label for="usuario-run">RUN</label>
                        <input id="usuario-run" maxlength="9" placeholder="19011022K" required>
                    </div>
                    <div class="form-group">
                        <label for="usuario-nombre">Nombre</label>
                        <input id="usuario-nombre" maxlength="50" required>
                    </div>
                    <div class="form-group">
                        <label for="usuario-apellidos">Apellidos</label>
                        <input id="usuario-apellidos" maxlength="100" required>
                    </div>
                    <div class="form-group">
                        <label for="usuario-correo">Correo</label>
                        <input id="usuario-correo" type="email" maxlength="100" required>
                    </div>
                    <div class="form-group">
                        <label for="usuario-rol">Tipo de usuario</label>
                        <select id="usuario-rol" required>
                            <option value="">Selecciona un rol</option>
                            <option>Administrador</option>
                            <option>Cliente</option>
                            <option>Vendedor</option>
                        </select>
                    </div>
                    <button class="btn btn-orange" type="submit">Crear usuario</button>
                    <div id="usuario-resultado" class="form-message"></div>
                </form>
                <h2>Usuarios registrados</h2>
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>RUN</th>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Rol</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="admin-usuarios-body"></tbody>
                    </table>
                </div>
            </section>
        </div>
        <script src="../js/app.js"></script>
    </body>
</html>
