<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Patitas Shop | Contacto</title>
        <link rel="stylesheet" href="css/estilos.css">
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <header class="navbar">
            <a href="index.html">
                <img src="img/patitashop2.png" alt="Patitas Shop" class="logo-img">
            </a>
            <nav class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="productos.html">Productos</a>
                <a href="nosotros.html">Nosotros</a>
                <a href="blogs.html">Blog</a>
                <a href="contacto.html">Contacto</a>
                <a href="carrito.html">🛒 (<span class="cart-count">0</span>)</a>
            </nav>
        </header>
        <main>
            <section class="page-header">
                <h1>Contacto</h1>
                <p>Envíanos tu mensaje y recomendaciones.</p>
            </section>
            <form class="form-card" onsubmit="validarContacto(event)" autocomplete="on">
                <div class="form-group">
                    <label for="contacto-nombre">Nombre</label>
                    <input id="contacto-nombre" maxlength="100" autocomplete="name" required>
                    <div id="error-contacto-nombre" class="form-message"></div>
                </div>
                <div class="form-group">
                    <label for="contacto-correo">Correo</label>
                    <input id="contacto-correo" type="email" maxlength="100" autocomplete="email">
                    <div id="error-contacto-correo" class="form-message"></div>
                </div>
                <div class="form-group">
                    <label for="contacto-comentario">Comentario</label>
                    <textarea id="contacto-comentario" maxlength="500" rows="6" required></textarea>
                    <div id="error-contacto-comentario" class="form-message"></div>
                </div>
                <button class="btn btn-orange" type="submit">Enviar mensaje</button>
                <div id="resultado-contacto" class="form-message"></div>
            </form>
        </main>
        <footer class="footer">
            <div>
                <h3>Patitas Shop</h3>
            </div>
            <div class="footer-center">
                Estamos para ayudarte.
            </div>
            <div class="footer-right">
                <a class="btn btn-light" href="index.html">Volver al inicio</a>
            </div>
        </footer>
        <script src="js/app.js"></script>
    </body>
</html>
