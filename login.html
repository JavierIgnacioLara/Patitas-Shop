<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Patitas Shop | Iniciar sesión</title>
        <link rel="stylesheet" href="css/estilos.css">
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <header class="navbar">
            <a href="index.html">
                <img src="img/patitashop2.png" alt="Patitas Shop" class="logo-img">
            </a>
            <nav class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="productos.html">Productos</a>
                <a href="registro.html">Registrarse</a>
                <a href="carrito.html">🛒 (<span class="cart-count">0</span>)</a>
            </nav>
        </header>
        <main>
            <section class="page-header">
                <h1>Iniciar sesión</h1>
                <p>Ingresa a tu cuenta de Patitas Shop.</p>
            </section>
            <form class="form-card" onsubmit="validarLogin(event)" autocomplete="on">
                <div class="form-group">
                    <label for="login-correo">Correo</label>
                    <input id="login-correo" type="email" maxlength="100" autocomplete="email" required placeholder="ejemplo@gmail.com">
                    <div id="error-login-correo" class="form-message"></div>
                </div>
                <div class="form-group">
                    <label for="login-clave">Contraseña</label>
                    <input id="login-clave" type="password" minlength="4" maxlength="10" autocomplete="current-password" required>
                    <div id="error-login-clave" class="form-message"></div>
                </div>
                <button class="btn btn-orange" type="submit">Iniciar sesión</button>
                <div id="resultado-login" class="form-message"></div>
                <p style="margin-top:15px">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>.</p>
            </form>
        </main>
        <footer class="footer">
            <div>
                <h3>Patitas Shop</h3>
            </div>
            <div class="footer-center">
                Tu tienda de mascotas.
            </div>
            <div class="footer-right">
                <a class="btn btn-light" href="contacto.html">Contacto</a>
            </div>
        </footer>
        <script src="js/app.js"></script>
    </body>
</html>
