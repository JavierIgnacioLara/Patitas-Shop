<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Patitas Shop | Registro</title>
        <link rel="stylesheet" href="css/estilos.css">
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>
<header class="navbar">
    <a href="index.html">
        <img src="img/patitashop2.png" alt="Logo Patitas Shop" class="logo-img"></a>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="login.html">Iniciar sesión</a>
            <a href="carrito.html">🛒 (<span class="cart-count">0</span>)
            </a></nav></header>
<main>
    <section class="page-header">
        <h1>Registro de usuario</h1>
        <p>Completa tus datos para crear una cuenta.</p>
    </section><form class="form-card" onsubmit="validarRegistro(event)" autocomplete="on">
<div class="form-group">
    <label for="registro-run">RUN</label>
    <input id="registro-run" maxlength="9" autocomplete="off" placeholder="19011022K" required>
    <div id="error-registro-run" class="form-message"></div></div>
<div class="form-group">
    <label for="registro-nombre">Nombre</label>
    <input id="registro-nombre" maxlength="50" autocomplete="given-name" required>
    <div id="error-registro-nombre" class="form-message"></div></div>
<div class="form-group">
    <label for="registro-apellidos">Apellidos</label>
    <input id="registro-apellidos" maxlength="100" autocomplete="family-name" required>
    <div id="error-registro-apellidos" class="form-message"></div></div>
<div class="form-group">
    <label for="registro-correo">Correo</label>
    <input id="registro-correo" type="email" maxlength="100" autocomplete="email" required>
    <div id="error-registro-correo" class="form-message"></div></div>
<div class="form-group">
    <label for="registro-clave">Contraseña</label>
    <input id="registro-clave" type="password" minlength="4" maxlength="10" autocomplete="new-password" required>
    <div id="error-registro-clave" class="form-message"></div></div>
<div class="form-group">
    <label for="registro-fecha">Fecha de nacimiento</label>
    <input id="registro-fecha" type="date" autocomplete="bday">
</div>
<div class="form-group">
    <label for="registro-region">Región</label>
    <select id="registro-region" required></select>
    <div id="error-registro-region" class="form-message"></div></div>
<div class="form-group">
    <label for="registro-comuna">Comuna</label>
    <select id="registro-comuna" required>
        <option value="">Selecciona una comuna</option>
    </select>
    <div id="error-registro-comuna" class="form-message"></div>
</div>
<div class="form-group">
    <label for="registro-direccion">Dirección</label>
    <textarea id="registro-direccion" maxlength="300" autocomplete="street-address" required></textarea>
    <div id="error-registro-direccion" class="form-message"></div>
</div>
<button class="btn btn-orange" type="submit">Registrar usuario</button>
<div id="resultado-registro" class="form-message"></div>
</form>
</main>
<footer class="footer">
    <div><h3>Patitas Shop</h3></div>
    <div class="footer-center">Cuidamos a quienes más quieres.</div>
    <div class="footer-right">
        <a href="contacto.html">Contacto</a>
    </div>
</footer>
<script src="js/app.js"></script>
</body>
</html>
